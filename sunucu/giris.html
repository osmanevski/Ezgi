<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ezgi Paneli</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%2240%2040%201960%201960%22%20style%3D%22background%3A%23000%22%20role%3D%22img%22%20aria-label%3D%22Ezgi%22%3E%3Ccircle%20cx%3D%221024%22%20cy%3D%221024%22%20r%3D%22925%22%20fill%3D%22none%22%20stroke%3D%22%23EBC35A%22%20stroke-width%3D%2250%22/%3E%3Ccircle%20cx%3D%221024%22%20cy%3D%221024%22%20r%3D%22327%22%20fill%3D%22%23A70000%22/%3E%3Ccircle%20cx%3D%221024%22%20cy%3D%221024%22%20r%3D%2239%22%20fill%3D%22%23000%22/%3E%3Cpolyline%20points%3D%221790%2C250%201700%2C1000%201545%2C1235%22%20fill%3D%22none%22%20stroke%3D%22%23000%22%20stroke-width%3D%22150%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3Cpolyline%20points%3D%221790%2C250%201700%2C1000%201545%2C1235%22%20fill%3D%22none%22%20stroke%3D%22%23A70000%22%20stroke-width%3D%2280%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3Cline%20x1%3D%221610%22%20y1%3D%221140%22%20x2%3D%221480%22%20y2%3D%221330%22%20stroke%3D%22%23000%22%20stroke-width%3D%22230%22/%3E%3Cline%20x1%3D%221610%22%20y1%3D%221140%22%20x2%3D%221480%22%20y2%3D%221330%22%20stroke%3D%22%23A70000%22%20stroke-width%3D%22150%22/%3E%3Ccircle%20cx%3D%221790%22%20cy%3D%22250%22%20r%3D%22180%22%20fill%3D%22%23000%22/%3E%3Ccircle%20cx%3D%221790%22%20cy%3D%22250%22%20r%3D%22135%22%20fill%3D%22%23EBC35A%22/%3E%3Ccircle%20cx%3D%221790%22%20cy%3D%22250%22%20r%3D%2250%22%20fill%3D%22%23000%22/%3E%3C/svg%3E">
<style>
  :root { --bg:#000; --kart:#111; --cizgi:#262626; --yazi:#eee; --soluk:#8a8a8a; --altin:#EBC35A; --kirmizi:#E5534B; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--yazi);
         font:15px/1.45 -apple-system, system-ui, "Segoe UI", sans-serif; padding:16px; }
  form { width:100%; max-width:340px; background:var(--kart); border:1px solid var(--cizgi); border-radius:20px; padding:32px 28px; text-align:center; }
  h1 { margin:0 0 4px; font-size:22px; }
  p { margin:0 0 22px; color:var(--soluk); font-size:14px; }
  input { width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--cizgi); background:#0a0a0a; color:var(--yazi); font:inherit; outline:none; }
  input:focus { border-color:var(--altin); }
  button { width:100%; margin-top:12px; padding:13px; border:0; border-radius:12px; background:var(--altin); color:#000; font:inherit; font-weight:650; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .hata { color:var(--kirmizi); font-size:13px; min-height:20px; margin-top:12px; }
  .gizli { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  .logo { width:84px; height:84px; flex:none; margin:0 auto 18px; }
  .logo svg { width:100%; height:100%; display:block; }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="40 40 1960 1960" role="img" aria-label="Ezgi"><circle cx="1024" cy="1024" r="925" fill="none" stroke="#EBC35A" stroke-width="50"/><circle cx="1024" cy="1024" r="327" fill="#A70000"/><circle cx="1024" cy="1024" r="39" fill="#000"/><polyline points="1790,250 1700,1000 1545,1235" fill="none" stroke="#000" stroke-width="150" stroke-linecap="round" stroke-linejoin="round"/><polyline points="1790,250 1700,1000 1545,1235" fill="none" stroke="#A70000" stroke-width="80" stroke-linecap="round" stroke-linejoin="round"/><line x1="1610" y1="1140" x2="1480" y2="1330" stroke="#000" stroke-width="230"/><line x1="1610" y1="1140" x2="1480" y2="1330" stroke="#A70000" stroke-width="150"/><circle cx="1790" cy="250" r="180" fill="#000"/><circle cx="1790" cy="250" r="135" fill="#EBC35A"/><circle cx="1790" cy="250" r="50" fill="#000"/></svg></div>
  <h1>Ezgi Paneli</h1>
  <p>İndirmeler ve dinleme akışı</p>
  <!-- Safari şifreyi "osman" adıyla kaydetsin -->
  <input class="gizli" type="text" name="username" autocomplete="username" value="osman" tabindex="-1" aria-hidden="true">
  <input id="s" type="password" name="password" autocomplete="current-password" placeholder="Şifre" autofocus required>
  <button id="b" type="submit">Giriş yap</button>
  <div class="hata" id="h"></div>
</form>
<script>
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const b = document.getElementById("b"), h = document.getElementById("h");
  b.disabled = true; h.textContent = "";
  try {
    const r = await fetch("giris", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sifre: document.getElementById("s").value }) });
    if (r.ok) { location.reload(); return; }
    h.textContent = (await r.json().catch(() => ({}))).hata || "Giriş olmadı";
  } catch { h.textContent = "Sunucuya ulaşılamadı"; }
  b.disabled = false;
};
</script>
</body>
</html>
