<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ezgi Paneli</title>
<style>
  :root { --bg:#000; --kart:#111; --cizgi:#262626; --yazi:#eee; --soluk:#8a8a8a; --altin:#EBC35A; --kirmizi:#E5534B; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--yazi);
         font:15px/1.45 -apple-system, system-ui, "Segoe UI", sans-serif; padding:16px; }
  form { width:100%; max-width:340px; background:var(--kart); border:1px solid var(--cizgi); border-radius:20px; padding:32px 28px; text-align:center; }
  .logo { width:64px; height:64px; margin:0 auto 18px; border-radius:50%; border:5px solid var(--altin); display:grid; place-items:center; }
  .logo i { width:22px; height:22px; border-radius:50%; background:#A70000; display:block; }
  h1 { margin:0 0 4px; font-size:22px; }
  p { margin:0 0 22px; color:var(--soluk); font-size:14px; }
  input { width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--cizgi); background:#0a0a0a; color:var(--yazi); font:inherit; outline:none; }
  input:focus { border-color:var(--altin); }
  button { width:100%; margin-top:12px; padding:13px; border:0; border-radius:12px; background:var(--altin); color:#000; font:inherit; font-weight:650; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .hata { color:var(--kirmizi); font-size:13px; min-height:20px; margin-top:12px; }
  .gizli { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <div class="logo"><i></i></div>
  <h1>Ezgi Paneli</h1>
  <p>İndirmeler ve dinleme akışı</p>
  <!-- Safari şifreyi "osman" adıyla kaydetsin -->
  <input class="gizli" type="text" name="username" autocomplete="username" value="osman" tabindex="-1" aria-hidden="true">
  <input id="s" type="password" name="password" autocomplete="current-password" placeholder="Şifre" autofocus required>
  <button id="b" type="submit">Giriş yap</button>
  <div class="hata" id="h"></div>
</form>
<script>
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const b = document.getElementById("b"), h = document.getElementById("h");
  b.disabled = true; h.textContent = "";
  try {
    const r = await fetch("giris", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sifre: document.getElementById("s").value }) });
    if (r.ok) { location.reload(); return; }
    h.textContent = (await r.json().catch(() => ({}))).hata || "Giriş olmadı";
  } catch { h.textContent = "Sunucuya ulaşılamadı"; }
  b.disabled = false;
};
</script>
</body>
</html>
